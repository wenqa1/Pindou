services:
  bean-warehouse:
    build: .
    container_name: bean-warehouse
    restart: unless-stopped
    ports:
      - "8786:8786"
    environment:
      PORT: "8786"
      DATA_PATH: /data/bean-warehouse.sqlite
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8786/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
