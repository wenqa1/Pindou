definitions:
  environment: &ios_environment
    xcode: latest
  artifacts: &ios_artifacts
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
  install_xcodegen: &install_xcodegen
    name: Install XcodeGen
    script: |
      if ! command -v xcodegen >/dev/null 2>&1; then
        brew install xcodegen
      fi
  generate_project: &generate_project
    name: Generate Xcode project
    script: |
      cd "$CM_BUILD_DIR/PindouApp"
      xcodegen generate

workflows:
  ios-validation:
    name: iOS 16 validation
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      <<: *ios_environment
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - *install_xcodegen
      - *generate_project
      - name: Build and run unit tests
        script: |
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime in data["devices"].values() for device in runtime if device["name"].startswith("iPhone")))')"
          cd "$CM_BUILD_DIR/PindouApp"
          xcodebuild test \
            -project PindouApp.xcodeproj \
            -scheme PindouApp \
            -configuration Test \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

  ios-ipa-adhoc:
    name: Ad Hoc IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      <<: *ios_environment
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.yourcompany.pindou
    scripts:
      - *install_xcodegen
      - *generate_project
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/PindouApp"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Build Ad Hoc IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/PindouApp/PindouApp.xcodeproj" \
            --scheme PindouApp
    artifacts: *ios_artifacts

  ios-testflight:
    name: TestFlight IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      <<: *ios_environment
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourcompany.pindou
    scripts:
      - *install_xcodegen
      - *generate_project
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR/PindouApp"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Build App Store IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/PindouApp/PindouApp.xcodeproj" \
            --scheme PindouApp
    artifacts: *ios_artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
